<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumen de ingesta de contratos</title>
<style>
  :root {
    --accent: #1f6f5c;
    --accent-light: #e7f2ef;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e2;
    --bg: #ffffff;
    --conf-alta: #1f6f5c;
    --conf-media: #b98a00;
    --conf-baja: #a33a3a;
    --alert-bg: #fdf3e7;
    --alert-border: #e8c78a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }
  header.page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  header.page-header h1 { margin: 0 0 6px; font-size: 22px; }
  header.page-header .meta { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .btn-download {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn-download:hover { background: #17594a; }

  .kpi-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .kpi-card {
    flex: 1 1 180px;
    background: var(--accent-light);
    border-radius: 8px;
    padding: 16px 18px;
  }
  .kpi-card .value { font-size: 28px; font-weight: 700; color: var(--accent); }
  .kpi-card .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .kpi-card.alert .value { color: var(--conf-baja); }

  .grid-2 { display: grid; grid-template-columns: 1.1fr 1.4fr; gap: 20px; margin-bottom: 28px; }
  @media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

  .panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
  }
  .panel h2 { margin: 0 0 14px; font-size: 15px; }

  .vencimientos-list { list-style: none; margin: 0; padding: 0; }
  .vencimientos-list li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .vencimientos-list li:last-child { border-bottom: none; }
  .vencimientos-list .dias {
    font-weight: 700;
    color: var(--conf-media);
    white-space: nowrap;
  }
  .vencimientos-empty { color: var(--muted); font-size: 13px; }

  .filters { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters input, .filters select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .filters input { flex: 1 1 220px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    background: var(--accent);
    color: #fff;
    padding: 10px 10px;
    position: sticky;
    top: 0;
  }
  tbody td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: #fafafa; }

  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }
  .badge.alta { background: var(--conf-alta); }
  .badge.media { background: var(--conf-media); }
  .badge.baja { background: var(--conf-baja); }

  .table-wrap { max-height: 560px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }

  footer.note {
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-header">
    <div>
      <h1 id="titulo">Resumen de ingesta de contratos</h1>
      <div class="meta" id="meta-info"></div>
    </div>
    <a class="btn-download" id="btn-descargar-excel" href="#" download>⬇ Descargar Excel</a>
  </header>

  <div class="kpi-row" id="kpi-row"></div>

  <div class="grid-2">
    <div class="panel">
      <h2>Distribución de confianza</h2>
      <canvas id="chart-confianza" height="200"></canvas>
    </div>
    <div class="panel">
      <h2 id="vencimientos-titulo">Vencimientos próximos</h2>
      <ul class="vencimientos-list" id="vencimientos-list"></ul>
    </div>
  </div>

  <div class="panel">
    <h2>Contratos analizados</h2>
    <div class="filters">
      <input type="text" id="filtro-proveedor" placeholder="Buscar por proveedor o N° de contrato...">
      <select id="filtro-confianza">
        <option value="">Todas las confianzas</option>
        <option value="alta">Alta</option>
        <option value="media">Media</option>
        <option value="baja">Baja</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Proveedor</th>
            <th>N° Contrato</th>
            <th>RUT / RUN</th>
            <th>Vigencia</th>
            <th>Monto total</th>
            <th>Confianza</th>
            <th>Notas</th>
          </tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
  </div>

  <footer class="note" id="footer-note"></footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
  // Este bloque lo reemplaza build_ingest_summary.py con la data real de la corrida.
  const INGEST_SUMMARY_DATA = __INGEST_SUMMARY_DATA_JSON__;

  const d = INGEST_SUMMARY_DATA;

  document.getElementById('titulo').textContent = `Resumen de ingesta — ${d.categoria}`;
  document.getElementById('meta-info').innerHTML =
    `Cliente: ${d.cliente} &nbsp;•&nbsp; Fecha de extracción: ${d.fecha_extraccion} &nbsp;•&nbsp; ` +
    `Versión: ${d.version}${d.version_anterior ? ' (anterior: ' + d.version_anterior + ')' : ''} ` +
    `&nbsp;•&nbsp; Generado: ${d.generated_at}`;

  const btnExcel = document.getElementById('btn-descargar-excel');
  btnExcel.href = d.excel_filename;
  btnExcel.setAttribute('download', d.excel_filename);

  const kpiRow = document.getElementById('kpi-row');
  const kpis = [
    { label: 'Proveedores analizados', value: d.total_proveedores },
    { label: 'Contratos totales', value: d.total_contratos },
    { label: 'Con alertas (confianza baja o notas)', value: d.con_alertas, alert: d.con_alertas > 0 },
    { label: `Vencen en ${d.dias_alerta_vencimiento} días`, value: d.vencimientos_proximos.length, alert: d.vencimientos_proximos.length > 0 },
  ];
  kpiRow.innerHTML = kpis.map(k => `
    <div class="kpi-card${k.alert ? ' alert' : ''}">
      <div class="value">${k.value}</div>
      <div class="label">${k.label}</div>
    </div>`).join('');

  new Chart(document.getElementById('chart-confianza'), {
    type: 'doughnut',
    data: {
      labels: ['Alta', 'Media', 'Baja'],
      datasets: [{
        data: [d.confianza.alta || 0, d.confianza.media || 0, d.confianza.baja || 0],
        backgroundColor: ['#1f6f5c', '#b98a00', '#a33a3a'],
      }]
    },
    options: { plugins: { legend: { position: 'bottom' } } }
  });

  const vencList = document.getElementById('vencimientos-list');
  document.getElementById('vencimientos-titulo').textContent =
    `Vencimientos próximos (${d.dias_alerta_vencimiento} días)`;
  if (d.vencimientos_proximos.length === 0) {
    vencList.innerHTML = `<li class="vencimientos-empty">Ningún contrato vence en los próximos ${d.dias_alerta_vencimiento} días.</li>`;
  } else {
    vencList.innerHTML = d.vencimientos_proximos.map(v => `
      <li>
        <span>${v.proveedor} — ${v.numero_contrato} (${v.fecha_fin})</span>
        <span class="dias">${v.dias_restantes} días</span>
      </li>`).join('');
  }

  function renderTabla(filtroTexto, filtroConfianza) {
    const texto = filtroTexto.trim().toLowerCase();
    const filas = d.contratos.filter(c => {
      const matchTexto = !texto ||
        c.proveedor.toLowerCase().includes(texto) ||
        String(c.numero_contrato).toLowerCase().includes(texto);
      const matchConfianza = !filtroConfianza || c.confianza === filtroConfianza;
      return matchTexto && matchConfianza;
    });
    document.getElementById('tabla-body').innerHTML = filas.map(c => `
      <tr>
        <td>${c.proveedor}</td>
        <td>${c.numero_contrato}</td>
        <td>${c.rut}</td>
        <td>${c.fecha_inicio} → ${c.fecha_fin}</td>
        <td>${c.monto_total}</td>
        <td><span class="badge ${c.confianza}">${c.confianza}</span></td>
        <td>${c.notas || '—'}</td>
      </tr>`).join('');
  }
  renderTabla('', '');
  document.getElementById('filtro-proveedor').addEventListener('input', e =>
    renderTabla(e.target.value, document.getElementById('filtro-confianza').value));
  document.getElementById('filtro-confianza').addEventListener('change', e =>
    renderTabla(document.getElementById('filtro-proveedor').value, e.target.value));

  document.getElementById('footer-note').textContent =
    `Generado automáticamente a partir del JSON consolidado de contract-ingest (${d.version}). ` +
    `Para el detalle completo con trazabilidad de fuente y confianza campo por campo, usá el Excel descargable.`;
</script>
</body>
</html>
